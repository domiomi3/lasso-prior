prior:
  num_steps: 4000 
  batch_size: 4 
  device: "cpu"
  min_features: 50
  max_features: 250 
  max_num_classes: 10
  num_datapoints_min: 40
  num_datapoints_max: 300

feature_adding:
  add_features_min: 200
  add_features_max: 1500
  warmup_steps: 0
  min_sparsity: 0.0
  max_sparsity: 0.05
  min_noise: 0.0
  max_noise: 1.0

feature_selection:
  method: "lasso"
  n_bootstrap: 20
  max_iter: 5000
  normalize: true
  random_state: 44
  tolerance: 0.01
  C_min: 0.1      
  C_max: 0.4
  max_sparsity: 0.90        

data_generation:
  output_dir: "experiments/data/generated"
  exp_name: "test_on_real_data"
  add_timestamp: True

training:
  data_loader:
    data_dir: "experiments/data/generated/training_data_10000_20251119_142507"
    max_sparsity_dataset: 0.95
    max_sparsity_batch: 0.85
    load_to_memory: true
    min_valid_datasets: 1
    train_test_split: 0.8
  
  model:
    model_name: "TabPFN-Wide-5k"
    model_path: "./models"
    embedding_layer: 4
  
  optimizer:
    learning_rate: 0.0001
    weight_decay: 0.0001
    gradient_clip: 1.0
    scheduler: "cosine"
    warmup_proportion: 0.02
    num_cycles: 10

  wandb:
    use_wandb: True
    project: "tabpfnwide-pretraining"
    entity: "domiomi3"
    run_name: "bs4_stp4000_emb4_144kparams"
  
  experiment_name: "train_lasso_4000"
  num_steps: 4000
  batch_size: 4
  seed: 42
  checkpoint_dir: "checkpoints"
  val_data_dir: "experiments/data/generated/validation_data_200_20251119_135150"
  save_interval: 500
  log_interval: 10
  val_interval: 20
  resume_from: null
  device: null 
  grad_accum_steps: 4
  embedding_layer: 4