[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lasso_prior"
version = "0.1.0"
description = "TabPFN-based feature selection with lasso prior"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "scikit-learn",
    "pyyaml",
    "tqdm",
    "tabpfn==2.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
